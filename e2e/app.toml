# ephpm config for the WordPress worker-mode e2e image.
[server]
listen = "0.0.0.0:8080"
document_root = "/var/www/html"        # the WordPress root (ABSPATH)

[php]
mode = "worker"
concurrency = 3                        # worker-thread pool size — a few workers so
                                       # exit-based routes (wp-login/REST end in
                                       # exit -> recycle) don't starve the pool

[php.worker]
script = "worker.php"
populate_superglobals = true           # REQUIRED for WordPress
max_requests = 2000
boot_timeout = 120                     # generous boot window for WordPress
